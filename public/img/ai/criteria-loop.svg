<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7280"/></marker>
<marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3b5bdb"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="52" font-size="14" font-weight="700" fill="#1f2328">기준이 없을 때 — 도구를 좇는 루프</text>
<text x="452" y="52" font-size="14" font-weight="700" fill="#3b5bdb">기준을 세운 뒤 — 회사 목표에서 출발</text>
<line x1="418" x2="418" y1="36" y2="270" stroke="#d0d7de" stroke-dasharray="4 4"/>
<rect x="40" y="90" width="150" height="40" rx="8" fill="#eef2f7" stroke="#d0d7de"/><text x="115.0" y="115" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">새 도구·모델 등장</text><rect x="220" y="90" width="150" height="40" rx="8" fill="#eef2f7" stroke="#d0d7de"/><text x="295.0" y="115" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">써 본다</text><rect x="220" y="190" width="150" height="40" rx="8" fill="#eef2f7" stroke="#d0d7de"/><text x="295.0" y="215" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">'이래서 좋구나'</text><rect x="40" y="190" width="150" height="40" rx="8" fill="#eef2f7" stroke="#d0d7de"/><text x="115.0" y="215" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">일하는 방식은 그대로</text><path d="M190 110 H218" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><path d="M295.0 130 V188" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><path d="M218 210 H192" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><path d="M115.0 188 V132" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="270" font-size="11" fill="#6b7280">도구는 늘었는데 성과로 이어지지 않았다</text>
<rect x="452" y="70" width="270" height="40" rx="8" fill="#e7ecfd" stroke="#3b5bdb"/><text x="587.0" y="95" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">회사 목표 (매출·비용)</text><path d="M587.0 110 V120" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="452" y="122" width="270" height="40" rx="8" fill="#eef2f7" stroke="#d0d7de"/><text x="587.0" y="147" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">진짜 병목 찾기</text><path d="M587.0 162 V172" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="452" y="174" width="270" height="40" rx="8" fill="#eef2f7" stroke="#d0d7de"/><text x="587.0" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">AI로 병목 줄이기</text><path d="M587.0 214 V224" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/><rect x="452" y="226" width="270" height="40" rx="8" fill="#e7ecfd" stroke="#3b5bdb"/><text x="587.0" y="251" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">목표에 닿았나 확인</text><path d="M722 246 h18 V90 h-16" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#b)"/>
</svg>